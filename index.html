<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b6ea5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon-192.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Arvash Pool — Fleet Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { height: 100%; margin: 0; }
      .boot-screen { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f5f7fa; color: #17212b; font: 600 16px Inter, sans-serif; }
      .boot-brand { display: flex; align-items: center; gap: 10px; }
      .boot-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 6px; background: #3b6ea5; }
      .boot-mark svg { width: 20px; height: 20px; color: white; }
      .boot-indicator { width: 34px; height: 3px; overflow: hidden; border-radius: 2px; background: #dce3eb; }
      .boot-indicator::after { content: ''; display: block; width: 45%; height: 100%; background: #3b6ea5; animation: boot-progress 1s ease-in-out infinite alternate; }
      @keyframes boot-progress { from { transform: translateX(0); } to { transform: translateX(122%); } }
      @media (prefers-reduced-motion: reduce) { .boot-indicator::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Loading Arvash Pool">
        <div class="boot-brand"><span class="boot-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2" fill="currentColor"></circle></svg></span><span>Arvash Pool</span></div>
        <span class="boot-indicator" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch((error) => {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
